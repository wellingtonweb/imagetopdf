<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processador de Imagens em 3 Passos</title>
    <script src="./tailwindcss_3-4-17.js"></script>
    <link href="./style.css" rel="stylesheet">
    <link href="./cropper.min.css" rel="stylesheet">
    <script src="./cropper.min.js"></script>
    <script src="./jspdf.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-xl">
        <div class="flex justify-center text-indigo-700 gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-10">
                <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
            </svg>
            <h1 class="text-3xl font-bold mb-8 text-center">
                Processamento de imagem
            </h1>
        </div>

        <div id="step1" class="mb-8 p-4 border-l-4 border-indigo-500 bg-indigo-50 rounded-md">
            <h2 class="text-xl font-semibold mb-3">Passo 1: Selecionar imagem</h2>
            <input type="file" id="imageUpload" accept="image/*" class="w-full p-2 border rounded bg-white">
        </div>
        
        <div id="step2" class="hidden mb-8 p-4 border-l-4 border-yellow-500 bg-yellow-50 rounded-md">
            <h2 class="text-xl font-semibold mb-3">Passo 2: Selecione a área que deseja recortar da imagem</h2>
            <div class="img-container border-2 border-dashed border-gray-400 bg-gray-50">
                <img id="imageToCrop" style="max-width: 100%; display: none;" alt="Imagem para Recorte">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="location.reload()" class="w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition duration-150">
                    Cancelar
                </button>
                <button id="cropButton" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded transition duration-150">
                    Recortar Seleção
                </button>
            </div>
        </div>

        <div id="step3" class="hidden mb-8 p-4 border-l-4 border-green-500 bg-green-50 rounded-md">
            <h2 class="text-xl font-semibold mb-3">Passo 3: Pré-visualização do documento</h2>
            <div id="processedImageContainer" class="mt-6"></div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="location.reload()" class="w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition duration-150">
                    Cancelar
                </button>
                <button id="printButton" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition duration-150">
                    Imprimir
                </button>
                <button id="savePdfButton" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded transition duration-150">
                    Salvar PDF
                </button>
            </div>
        </div>
    </div>

    <dialog id="myDialog">
        <p id="data-text"></p>
        <button id="closeDialog">OK</button>
    </dialog>

    <script src="./main.js"></script>
</body>

</html>
